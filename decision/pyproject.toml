[project]
name = "controlplane-decision"
version = "0.1.0"
description = "ControlPlane.ai — decision engine: detector findings + policy -> tiered decision"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "controlplane-detectors",
    "controlplane-policy",
]

[project.optional-dependencies]
# Only the end-to-end CLI (`python -m controlplane_decision --run ...`) needs the
# real detector models; the engine itself and its test suite do not.
ml = ["controlplane-detectors[ml]"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[tool.uv.sources]
controlplane-detectors = { path = "../detectors", editable = true }
controlplane-policy = { path = "../policy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controlplane_decision"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
