# ControlPlane.ai local stack. `docker compose up` brings up the full path:
# gateway + Postgres (audit store) + Redis (conversation state, later phases).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: controlplane
      POSTGRES_DB: controlplane
    ports:
      # Host port shifted to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U controlplane" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      # Host 8080 -> container 8000 (8000 is often taken by other local dev tools).
      - "8080:8000"
    env_file:
      - .env
    environment:
      # DATABASE_URL/REDIS_URL come from .env (git-ignored) via docker
      # compose's own ${VAR} substitution, not hardcoded here — this file is
      # git-tracked, .env is not. Currently point at external cloud Postgres/
      # Redis (Render + Redis Cloud), not the local postgres/redis services
      # below — intentional; see .env for the actual values.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      POLICIES_DIR: /app/policies
    volumes:
      # Live-edit policy packs without a rebuild (Phase 8 adds a UI editor).
      - ./policies:/app/policies:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
