# ControlPlane.ai local stack. `docker compose up` brings up the full path:
# gateway + Postgres (audit store) + Redis (conversation state, later phases).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: controlplane
      POSTGRES_DB: controlplane
    ports:
      # Host port shifted to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      # Host 8080 -> container 8000 (8000 is often taken by other local dev tools).
      - "8080:8000"
    env_file:
      - .env
    environment:
      # Container-network overrides (win over .env, which targets host runs).
      DATABASE_URL: postgresql+asyncpg://controlplane:controlplane@postgres:5432/controlplane
      REDIS_URL: redis://redis:6379/0
      POLICIES_DIR: /app/policies
    volumes:
      # Live-edit policy packs without a rebuild (Phase 8 adds a UI editor).
      - ./policies:/app/policies:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
