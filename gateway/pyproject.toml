[project]
name = "controlplane-gateway"
version = "0.1.0"
description = "ControlPlane.ai — inline governance gateway (OpenAI-compatible proxy)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "redis>=5.1",
    "pyyaml>=6.0",
    "controlplane-detectors",
    "controlplane-policy",
    "controlplane-decision",
]

[project.optional-dependencies]
# The running gateway executes detectors in-process, so a real deployment needs
# the detector models. Kept out of base `dependencies` so the unit suite (which
# injects fakes) and PR CI stay light — `make install` and the Docker image pull
# this extra.
ml = ["controlplane-detectors[ml]"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
    "aiosqlite>=0.20",
]

[tool.uv.sources]
controlplane-detectors = { path = "../detectors", editable = true }
controlplane-policy = { path = "../policy", editable = true }
controlplane-decision = { path = "../decision", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controlplane_gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
